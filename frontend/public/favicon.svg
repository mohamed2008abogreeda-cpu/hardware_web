<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#E8C97A"/>
    </linearGradient>
    <linearGradient id="mag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C84B8A"/>
      <stop offset="100%" stop-color="#A82C6A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Gear -->
  <circle cx="40" cy="22" r="8" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="40" cy="22" r="3" fill="url(#gold)"/>
  <!-- 4 -->
  <text x="18" y="50" font-family="Inter, sans-serif" font-size="36" font-weight="900" fill="url(#mag)">4</text>
  <!-- Circuit lines -->
  <line x1="8" y1="56" x2="56" y2="56" stroke="url(#gold)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="14" cy="56" r="2" fill="url(#gold)" opacity="0.6"/>
  <circle cx="50" cy="56" r="2" fill="url(#gold)" opacity="0.6"/>
</svg>
